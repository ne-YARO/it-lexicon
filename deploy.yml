name: Deploy to GitHub Pages

# Автоматическая публикация сайта при каждом пуше в ветку main
# (а также кнопкой Run workflow во вкладке Actions)
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременных сборок не накапливаем — берём последнюю
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      - name: Собрать статический сайт
        run: npm run build:static
        env:
          STATIC_EXPORT: "1"

      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить готовый сайт
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js 16 с distDir ".next-static" кладёт экспорт именно сюда
          path: ./.next-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
